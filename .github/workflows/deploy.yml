name: Deploy production
run-name: Deploy production from ${{ github.ref_name }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: "production"
      url: "https://whitepaper.stacksjs.com"
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY is required for Hetzner compute deployments"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"

      - name: Verify source evidence and build
        run: |
          bun test
          bun run evidence:check
          bun run build

      # Provide the provider credentials your config needs as repo secrets.
      - run: bunx --bun @stacksjs/ts-cloud deploy --env 'production' --site 'whitepaper' --skip-dns-verification --yes
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TS_CLOUD_UI_DISABLE: '1'
